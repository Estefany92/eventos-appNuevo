{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card"><div class="card-body p-4">
    <h4 class="mb-3">Iniciar sesión</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Usuario</label>
        <input name="username" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="mt-3 mb-0 small">¿Eres cliente nuevo? <a href="{{ url_for('auth.registro') }}">Crea tu cuenta</a></p>
  </div></div>
</div></div>
{% endblock %}
