{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card"><div class="card-body p-4">
    <h4 class="mb-3">Crear cuenta de cliente</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Nombre completo</label>
        <input name="nombre" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Usuario</label>
        <input name="username" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Contraseña (mín. 6)</label>
        <input type="password" name="password" class="form-control" required minlength="6"></div>
      <button class="btn btn-success w-100">Registrarme</button>
    </form>
    <p class="mt-3 mb-0 small"><a href="{{ url_for('auth.login') }}">Volver al login</a></p>
  </div></div>
</div></div>
{% endblock %}
