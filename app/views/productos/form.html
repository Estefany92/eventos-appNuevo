{% extends "base.html" %}
{% block title %}Producto{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body p-4">
  <h4 class="mb-3">{{ 'Editar' if producto else 'Nuevo' }} producto / servicio</h4>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Nombre</label>
      <input name="nombre" class="form-control" required value="{{ producto.nombre if producto else '' }}"></div>
    <div class="row">
      <div class="col mb-3"><label class="form-label">Tipo</label>
        <select name="tipo" class="form-select">
          <option value="unidad" {{ 'selected' if producto and producto.tipo=='unidad' }}>Unidad</option>
          <option value="servicio" {{ 'selected' if producto and producto.tipo=='servicio' }}>Servicio</option>
        </select></div>
      <div class="col mb-3"><label class="form-label">Precio ($)</label>
        <input name="precio" type="number" step="0.01" min="0" class="form-control" required
               value="{{ producto.precio if producto else '' }}"></div>
    </div>
    <div class="mb-3"><label class="form-label">Descripción</label>
      <input name="descripcion" class="form-control" value="{{ (producto.descripcion or '') if producto else '' }}"></div>
    {% if producto %}<div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="activo" id="activo" {{ 'checked' if producto.activo }}>
      <label class="form-check-label" for="activo">Activo</label></div>{% endif %}
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-link" href="{{ url_for('productos.listar') }}">Cancelar</a>
  </form>
</div></div></div></div>
{% endblock %}
